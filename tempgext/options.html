<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeepTeamsAwake Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>KeepTeamsAwake</h1>
    <label for="timeoutHours">Timeout after no human activity</label>
    <div class="inputRow">
      <input id="timeoutHours" type="number" min="0.1" max="24" step="0.5" inputmode="decimal">
      <span>hours</span>
    </div>
    <button id="saveButton" type="button">Save</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
